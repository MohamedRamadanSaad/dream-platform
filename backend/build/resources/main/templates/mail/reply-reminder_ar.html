<!DOCTYPE html>
<!--/* reply-reminder (ar) — copy is literal here (per-locale file); subject + preheader: messages mail.reply-reminder.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}">
<head><title>reply-reminder</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">السلام عليكم<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>،</p>
  <p style="margin:0 0 16px 0;">ما زالت المعبّرة بانتظار ردك على استفسارها بخصوص رؤياك. ردك يساعد على إكمال التفسير.</p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;">خذ وقتك، فالتفسير سيُستكمل حين يصل ردك.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'الرد الآن')}"></table>
</div>
</body>
</html>
