<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1128" />
    <meta name="description" content="تفسير الرؤى بوضوح وعمق نحو سعادة الدارين — المعبرة فاطمة" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>إلى سعادة الدارين — تفسير الرؤى</title>
    <!-- apply the saved theme and direction before the first paint (no light flash, no RTL→LTR jump) -->
    <script>try{var s=(JSON.parse(localStorage.getItem('saadat-auth')||'{}').state)||{};if(s.theme==='dark')document.documentElement.classList.add('dark');if(s.locale==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
