<!DOCTYPE html>
<!--/* credits-withdrawn (ar): copy is literal here (per-locale file); subject + preheader: messages mail.credits-withdrawn.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}">
<head><title>credits-withdrawn</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">السلام عليكم<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>،</p>
  <p style="margin:0 0 16px 0;" th:text="${lead}">…</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 16px 0;border-collapse:collapse;background-color:#FFFFFF;border:1px solid #E6DCC8;border-radius:12px;">
    <tr th:if="${!#strings.isEmpty(orderRef)}">
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.order}">Label</td>
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" dir="ltr" th:text="${orderRef}">—</td>
    </tr>
    <tr th:if="${!#strings.isEmpty(packageName)}">
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.package}">Label</td>
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${packageName}">—</td>
    </tr>
    <tr th:if="${balance != null}">
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.balance}">Label</td>
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${balance}">—</td>
    </tr>
  </table>
  <p th:if="${!#strings.isEmpty(note)}" style="margin:0 0 16px 0;">ملاحظة المعبّرة: <strong th:text="${note}">…</strong></p>
  <p style="margin:0 0 16px 0;">رؤاك التي فُسِّرت أو التي قيد التعبير لا تتأثر بهذا الخصم.</p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;">للاستفسار تواصل معنا عبر البريد أدناه.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'عرض مدفوعاتي')}"></table>
</div>
</body>
</html>
