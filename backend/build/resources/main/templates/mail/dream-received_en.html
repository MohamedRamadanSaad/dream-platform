<!DOCTYPE html>
<!--/* dream-received (en) — copy is literal here (per-locale file); subject + preheader: messages mail.dream-received.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>dream-received</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">Assalamu alaikum<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;">Your dream has arrived. It will be studied carefully and calmly before the interpretation is written.</p>
  <p style="margin:0 0 16px 0;" th:if="${!#strings.isEmpty(expectedBy)}">Expected by: <strong th:text="${expectedBy}">—</strong></p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;" th:if="${!#strings.isEmpty(waitMessage)}" th:text="${waitMessage}">…</p>
  <p style="margin:0 0 16px 0;">We will let you know as soon as the interpretation is ready in your account.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'Follow your dream')}"></table>
</div>
</body>
</html>
