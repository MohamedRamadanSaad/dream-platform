<!DOCTYPE html>
<!--/* interpretation-ready (en) — copy is literal here (per-locale file); subject + preheader: messages mail.interpretation-ready.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>interpretation-ready</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">Assalamu alaikum<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;">The interpretation of your dream is now ready in your account.</p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;">We suggest reading it at a quiet moment. If a question remains, we are here.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'Read the interpretation')}"></table>
</div>
</body>
</html>
