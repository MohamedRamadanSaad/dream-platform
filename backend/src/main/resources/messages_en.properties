# English texts (UTF-8). Placeholders are NAMED: {key} is filled from the args/model map by
# com.saadat.mail.MessageText (messages are read raw — no MessageFormat, so apostrophes need no escaping).

# ---------------------------------------------------------------- in-app notifications: notif.<TYPE>.title/body
# args: userName (the dreamer, interpreter-facing types), credits, packageName, promotionName
notif.DREAM_SUBMITTED.title=New dream in the queue
notif.DREAM_SUBMITTED.body={userName} submitted a new dream; it is now in the review queue.
notif.DREAM_RECEIVED.title=Your dream has arrived
notif.DREAM_RECEIVED.body=We will study it carefully and let you know when the interpretation is ready.
notif.INTERPRETER_QUESTION.title=A question from the interpreter
notif.INTERPRETER_QUESTION.body=The interpreter has a question about your dream. Please reply so the interpretation can be completed.
notif.USER_REPLIED.title=Reply to your question
notif.USER_REPLIED.body={userName} replied to your question; the dream is back in the review queue.
notif.INTERPRETATION_READY.title=Your dream has been interpreted
notif.INTERPRETATION_READY.body=The interpretation is now ready in your account.
notif.PAYMENT_SUCCESS.title=Payment successful
notif.PAYMENT_SUCCESS.body={credits} dream credits were added to your balance.
notif.PROMOTION.title=A new offer
notif.PROMOTION.body={promotionName}

