<!DOCTYPE html>
<!--/* user-replied (en) — copy is literal here (per-locale file); subject + preheader: messages mail.user-replied.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>user-replied</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">Assalamu alaikum<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;"><strong th:text="${userName}">The dreamer</strong> replied to your question, and the dream is back in the review queue.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'Open the dream')}"></table>
</div>
</body>
</html>
