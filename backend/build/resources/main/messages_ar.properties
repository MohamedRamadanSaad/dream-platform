# Arabic texts (UTF-8). Placeholders are NAMED: {key} is filled from the args/model map by
# com.saadat.mail.MessageText (messages are read raw — no MessageFormat, so apostrophes need no escaping).

# ---------------------------------------------------------------- in-app notifications: notif.<TYPE>.title/body
# args: userName (the dreamer, interpreter-facing types), credits, packageName, promotionName
notif.DREAM_SUBMITTED.title=رؤيا جديدة في القائمة
notif.DREAM_SUBMITTED.body=وصلت رؤيا جديدة من {userName} وأُضيفت إلى قائمة المراجعة.
notif.DREAM_RECEIVED.title=وصلت رؤياك
notif.DREAM_RECEIVED.body=سنبدأ دراستها بعناية، وسيصلك إشعار حين يجهز التفسير.
notif.INTERPRETER_QUESTION.title=استفسار من المعبّرة
notif.INTERPRETER_QUESTION.body=أرسلت المعبّرة استفساراً عن رؤياك، يرجى الرد لإكمال التفسير.
notif.USER_REPLIED.title=رد على استفسارك
notif.USER_REPLIED.body=وصل رد {userName} على استفسارك، وعادت الرؤيا إلى قائمة المراجعة.
notif.INTERPRETATION_READY.title=تم تفسير رؤياك
notif.INTERPRETATION_READY.body=التفسير جاهز الآن في حسابك.
notif.PAYMENT_SUCCESS.title=تم الدفع بنجاح
notif.PAYMENT_SUCCESS.body=أُضيف إلى رصيدك {credits} من الرؤى.
notif.PROMOTION.title=عرض جديد
notif.PROMOTION.body={promotionName}

# ---------------------------------------------------------------- e-mail subjects and preheaders: mail.<template>.*
mail.magic-link.subject=رابط الدخول إلى {brandName}
mail.magic-link.preheader=رمز الدخول صالح لمدة {ttlMinutes} دقيقة ولمرة واحدة.
mail.dream-received.subject=وصلت رؤياك
mail.dream-received.preheader=سنبدأ دراستها بعناية، وسيصلك إشعار حين يجهز التفسير.
mail.interpreter-question.subject=استفسار بخصوص رؤياك
mail.interpreter-question.preheader=أرسلت المعبّرة سؤالاً يساعد على دقة التفسير.
mail.user-replied.subject=رد جديد من {userName}
mail.user-replied.preheader=وصل رد على استفسارك، وعادت الرؤيا إلى قائمة المراجعة.
