# Test profile (@ActiveProfiles("test")). The datasource URL/credentials are injected by
# IntegrationTestBase (@DynamicPropertySource from the Testcontainers PostgreSQL container).

spring:
  datasource:
    url: jdbc:postgresql://placeholder-overridden-by-testcontainers/test
    username: test
    password: test
  mail:
    host: ""                                   # empty → MailService logs instead of sending

sentry:
  dsn: ""
  environment: test

app:
  frontend-url: http://localhost:5173
  api-url: http://localhost:8080/api
  google-client-id: test-client-id
  auth:
    allow-mock: true
    mock-email: mock-user@example.com
    jwt-secret: test-secret-0123456789abcdef-0123456789abcdef
    refresh-cookie-secure: false
  payments:
    mock: true
    paymob:
      api-key: test-api-key
      integration-id: "123"
      iframe-id: "456"
      hmac-secret: test-hmac-secret
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    enabled: true
    auth-per-minute: 10000
    dreams-per-minute: 10000
    checkout-per-minute: 10000
    track-per-minute: 10000

logging:
  level:
    com.saadat: DEBUG
    org.testcontainers: INFO
