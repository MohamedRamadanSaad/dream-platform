# Local development: `docker compose up postgres` (deploy/), then
#   gradle bootRun --args='--spring.profiles.active=local'
# Every value here may be overridden by the corresponding env var.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dreams}
    username: ${DB_USERNAME:dreams}
    password: ${DB_PASSWORD:dreams}

sentry:
  environment: local

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  api-url: ${API_URL:http://localhost:8080/api}
  auth:
    allow-mock: true                      # idToken "mock" + X-Country header
    mock-email: ${AUTH_MOCK_EMAIL:ummohamed@gmail.com}
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    refresh-cookie-secure: false          # http://localhost
  payments:
    mock: ${PAYMENTS_MOCK:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.saadat: ${LOG_LEVEL_APP:DEBUG}
