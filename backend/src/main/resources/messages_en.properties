# ---------------------------------------------------------------- insights: insight.<rule>.title/body (GET /admin/analytics/insights)
insight.overdue.title=Dreams past the expected time
insight.overdue.body=Dreams past the expected reply time: {count}. Start with the oldest so no one waits longer.
insight.awaiting-reply.title=Users have not replied yet
insight.awaiting-reply.body=Dreams waiting for the user's reply for more than {days} days: {count}.
insight.busy-on.title=Turn on busy mode
insight.busy-on.body=The review queue has {count} dreams, more than you usually finish within the current reply time. Busy mode shows users a longer and more honest waiting time.
insight.busy-off.title=You can turn busy mode off
insight.busy-off.body=The review queue is small now ({count} dreams), so the normal reply time can be shown again.
insight.testimonials-pending.title=Reviews waiting for approval
insight.testimonials-pending.body=Reviews waiting for your approval: {count}. Approved reviews appear on the home page.
insight.traffic-up.title=More visits this month
insight.traffic-up.body=Visits are up {percent}% compared with the same days last month.
insight.traffic-down.title=Fewer visits this month
insight.traffic-down.body=Visits are down {percent}% compared with the same days last month. A new video can bring visitors back.
insight.peak-hours.title=Interpret when users are online
insight.peak-hours.body=Users are most active around {hour}. Interpreting around this time makes replies feel faster.
insight.youtube-time.title=Best time to publish a video
insight.youtube-time.body=Publish your next YouTube video on {day} around {hour}, when most visitors are on the site.
insight.country-price.title=Visits without payments from {country}
insight.country-price.body=Most visits come from {country}, but there were no paid orders from there in the last 30 days. Consider reviewing the price there.
insight.fast-response.title=Fast replies
insight.fast-response.body=Your average reply time in the last 30 days is {hours} hours, less than half of the {sla}-hour reply time.
insight.streak.title=Interpretation streak
insight.streak.body=Days in a row with interpreted dreams: {days}. Keep it up.
insight.interpreted-up.title=More dreams interpreted this month
insight.interpreted-up.body=Dreams interpreted this month: {count}, compared with {previous} last month.

