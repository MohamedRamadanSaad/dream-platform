# Production stack on the Hostinger VPS. Caddy terminates TLS and routes:
#   https://$DOMAIN        -> frontend (nginx, static SPA)
#   https://$DOMAIN/api/*  -> backend (Spring Boot)  [enabled once backend/ exists]
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    expose: ["80"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreams}
      POSTGRES_USER: ${POSTGRES_USER:-dreams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dreams} -d ${POSTGRES_DB:-dreams}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # backend:
  #   build: ../backend
  #   restart: unless-stopped
  #   env_file: backend.env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #   expose: ["8080"]

volumes:
  caddy_data:
  caddy_config:
  pg_data:
