server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 1024;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ~* \.(png|ico|webmanifest)$ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
  location ~* ^/(sw\.js|workbox-.*\.js|mockServiceWorker\.js|registerSW\.js)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
