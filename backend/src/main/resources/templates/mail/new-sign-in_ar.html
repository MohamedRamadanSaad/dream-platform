<!DOCTYPE html>
<!--/* new-sign-in (ar) — all copy from messages mail.new-sign-in.* / mail.label.* / mail.common.*; subject + preheader: mail.new-sign-in.subject/.preheader */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}">
<head><title>new-sign-in</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;"><span th:text="#{mail.common.greeting}">Greeting</span><th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>،</p>
  <p style="margin:0 0 16px 0;" th:text="#{mail.new-sign-in.line1}">…</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 16px 0;border-collapse:collapse;background-color:#FFFFFF;border:1px solid #E6DCC8;border-radius:12px;">
    <tr th:if="${!#strings.isEmpty(device)}">
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.device}">Label</td>
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;"><span dir="ltr" th:text="${device}">—</span></td>
    </tr>
    <tr th:if="${!#strings.isEmpty(deviceType)}">
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.deviceType}">Label</td>
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${deviceType}">—</td>
    </tr>
    <tr th:if="${!#strings.isEmpty(countryName)}">
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.country}">Label</td>
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${countryName}">—</td>
    </tr>
    <tr th:if="${!#strings.isEmpty(signedInAt)}">
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.time}">Label</td>
      <td align="right" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${signedInAt}">—</td>
    </tr>
  </table>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;" th:text="#{mail.new-sign-in.line2}">…</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, #{mail.new-sign-in.cta})}"></table>
</div>
</body>
</html>
