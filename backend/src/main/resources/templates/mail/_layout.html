<!DOCTYPE html>
<!--/*
  Shared e-mail layout. Usage from a template (one file per locale):
    <html th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}"> ... <div th:fragment="content">...</div>
  and one call-to-action:
    <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'Label')}"></table>
  Model provided by MailService: brandName, tagline, supportEmail, youtubeUrl, frontendUrl, subject, preheader, ctaUrl, year.
  Footer labels come from messages (mail.footer.*). Table-based, inline styles, brand colours:
  night #0A1128 (header/footer), gold #D4AF37 (brand line + button), pearl #F4EFE6 (body).
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(dir, lang, content)" th:attr="lang=${lang},dir=${dir}"
      th:with="align=${dir == 'rtl' ? 'right' : 'left'}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title th:text="${subject}">Subject</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    body, table, td, p, a, div, span, strong { font-family: 'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif; }
    a { color: #0A1128; }
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body th:attr="dir=${dir}" style="margin:0;padding:0;background-color:#F4EFE6;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<div th:text="${preheader}" style="display:none;max-height:0;max-width:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F4EFE6;opacity:0;">Preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:attr="dir=${dir}"
       style="background-color:#F4EFE6;border-collapse:collapse;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:600px;max-width:600px;border-collapse:separate;border:1px solid #E6DCC8;border-radius:16px;overflow:hidden;background-color:#F4EFE6;">
        <!-- header band -->
        <tr>
          <td align="center" class="px" style="background-color:#0A1128;padding:28px 32px 22px 32px;">
            <div th:text="${brandName}" style="font-family:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;font-size:22px;line-height:1.4;font-weight:600;color:#D4AF37;">Brand</div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:12px auto 10px auto;">
              <tr><td width="72" height="2" style="width:72px;height:2px;line-height:2px;font-size:0;background-color:#D4AF37;">&nbsp;</td></tr>
            </table>
            <div th:text="${tagline}" style="font-family:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;font-size:13px;line-height:1.6;color:#F4EFE6;">Tagline</div>
          </td>
        </tr>
        <!-- content -->
        <tr>
          <td class="px" th:attr="dir=${dir},align=${align}"
              style="padding:32px 36px 28px 36px;font-family:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;font-size:16px;line-height:1.9;color:#0A1128;background-color:#F4EFE6;">
            <th:block th:replace="${content}">Content</th:block>
          </td>
        </tr>
        <!-- footer -->
        <tr>
          <td align="center" class="px" style="background-color:#0A1128;padding:24px 32px;font-family:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;font-size:13px;line-height:1.8;color:#F4EFE6;">
            <a th:if="${!#strings.isEmpty(youtubeUrl)}" th:href="${youtubeUrl}" th:text="#{mail.footer.youtube}"
               style="color:#D4AF37;text-decoration:none;font-weight:600;">YouTube</a>
            <div th:if="${!#strings.isEmpty(supportEmail)}" style="margin-top:6px;">
              <span th:text="#{mail.footer.support}">Support</span>
              <a th:href="${'mailto:' + supportEmail}" th:text="${supportEmail}" style="color:#D4AF37;text-decoration:none;">support@example.com</a>
            </div>
            <div th:text="#{mail.footer.note}" style="margin-top:12px;font-size:12px;line-height:1.7;color:#AEB4C2;">Note</div>
            <div style="margin-top:6px;font-size:12px;color:#AEB4C2;">&copy; <span th:text="${year}">2026</span> <span th:text="${brandName}">Brand</span></div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>

<!--/* The single gold pill call-to-action (bulletproof button) + plain-link fallback. */-->
<table th:fragment="cta(url, label)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:28px 0 8px 0;border-collapse:collapse;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
        <tr>
          <td align="center" bgcolor="#D4AF37" style="border-radius:999px;background-color:#D4AF37;">
            <a th:href="${url}" th:text="${label}" target="_blank"
               style="display:inline-block;padding:14px 38px;font-family:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;font-size:16px;line-height:1.2;font-weight:600;color:#0A1128;text-decoration:none;border-radius:999px;">Open</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding-top:14px;font-family:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;font-size:12px;line-height:1.6;color:#5B6478;">
      <span th:text="#{mail.button.fallback}">If the button does not work, copy this link:</span><br>
      <a th:href="${url}" th:text="${url}" dir="ltr" style="color:#5B6478;word-break:break-all;">https://example.com</a>
    </td>
  </tr>
</table>
