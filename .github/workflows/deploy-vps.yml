name: deploy-vps
on:
  push: { branches: [main] }
  workflow_dispatch:
  # Monthly run (03:17 UTC on the 3rd): refreshes the GeoIP database below; DB-IP publishes a new file each month.
  schedule:
    - cron: '17 3 3 * *'
concurrency: { group: deploy-vps, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: "${{ secrets.VPS_SSH_KEY }}" }
      - name: trust host
        run: mkdir -p ~/.ssh && ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      # backend/ and frontend/ are replaced as a whole: extracting over the old copy kept files that were deleted or
      # renamed in git (e.g. the removed PaymobProvider.java, renumbered Flyway migrations) and broke the build.
      # deploy/ is extracted on top because it holds the server-only .env and backend.env.
      - name: sync sources
        run: |
          tar czf - --exclude=node_modules --exclude=dist --exclude=.git frontend deploy backend 2>/dev/null \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'set -e; mkdir -p /opt/saadat; tmp=$(mktemp -d /opt/saadat/.sync.XXXXXX)
                tar xzf - -C "$tmp"
                for d in backend frontend; do rm -rf "/opt/saadat/$d.old"; [ -d "/opt/saadat/$d" ] && mv "/opt/saadat/$d" "/opt/saadat/$d.old"; mv "$tmp/$d" "/opt/saadat/$d"; rm -rf "/opt/saadat/$d.old"; done
                mkdir -p /opt/saadat/deploy && cp -a "$tmp/deploy/." /opt/saadat/deploy/
                rm -rf "$tmp"'
      # Settings written into the server env files IN PLACE by deploy/ops/setenv.sh (values via SSH stdin, never on a
      # command line; unchanged values = no restart, no test e-mail).
      # Site e-mail: the mailbox password lives only in the GitHub secret SMTP_PASSWORD; host/user can be overridden
      # with repository variables.
      - name: mail settings
        id: mail
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.hostinger.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'support@saadatu-aldarein.com' }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then echo "secret SMTP_PASSWORD not set: e-mails stay in the backend log"; exit 0; fi
          case "$SMTP_PASSWORD" in *"'"*) echo "SMTP_PASSWORD must not contain a single quote"; exit 1;; esac
          result=$(printf "SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USERNAME=%s\nSMTP_PASSWORD='%s'\nSMTP_AUTH=true\nSMTP_STARTTLS=true\nMAIL_FROM=%s\n" \
              "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USERNAME" "$SMTP_PASSWORD" "$SMTP_USERNAME" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/backend.env")
          echo "mail settings: $result"
          if [ "$result" = "updated" ]; then
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "touch /opt/saadat/deploy/.recreate-backend"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Google sign-in: the OAuth web client ID is public (it ships in the frontend bundle). Backend verifies ID tokens
      # against it (GOOGLE_CLIENT_ID); the frontend gets it at build time (VITE_GOOGLE_CLIENT_ID).
      # Access: INTERPRETER_EMAILS (extra interpreter e-mails) comes only from the repository variable of the same
      # name — empty by default, so only addresses on the site domain get the dashboard.
      - name: google sign-in and access settings
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '957021915232-jaan66ks1mq88nj60add9gbjlc7jsb0g.apps.googleusercontent.com' }}
          INTERPRETER_EMAILS: ${{ vars.INTERPRETER_EMAILS || '' }}
        run: |
          backend=$(printf "GOOGLE_CLIENT_ID=%s\nINTERPRETER_EMAILS=%s\n" "$GOOGLE_CLIENT_ID" "$INTERPRETER_EMAILS" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/backend.env")
          echo "backend access settings: $backend"
          [ "$backend" = "updated" ] && ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "touch /opt/saadat/deploy/.recreate-backend"
          frontend=$(printf "VITE_GOOGLE_CLIENT_ID=%s\n" "$GOOGLE_CLIENT_ID" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/.env")
          echo "frontend build settings: $frontend"
      # Support-mailbox auto-reply: the Hostinger webhook secret lives only in the GitHub secret MAIL_WEBHOOK_SECRET.
      - name: mail webhook secret
        env:
          MAIL_WEBHOOK_SECRET: ${{ secrets.MAIL_WEBHOOK_SECRET }}
        run: |
          if [ -z "$MAIL_WEBHOOK_SECRET" ]; then echo "secret MAIL_WEBHOOK_SECRET not set: keeping the value already on the server"; exit 0; fi
          case "$MAIL_WEBHOOK_SECRET" in *[!A-Za-z0-9._-]*) echo "MAIL_WEBHOOK_SECRET has unexpected characters"; exit 1;; esac
          result=$(printf "MAIL_WEBHOOK_SECRET=%s\n" "$MAIL_WEBHOOK_SECRET" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/backend.env")
          echo "mail webhook secret: $result"
          [ "$result" = "updated" ] && ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "touch /opt/saadat/deploy/.recreate-backend" || true
      # Visitor country without Cloudflare: DB-IP "IP to Country Lite" (free, CC BY 4.0, one file per month). Downloaded
      # here (this month, else last month), checked (gzip OK, not empty, MaxMind DB metadata present) and copied to
      # /opt/saadat/geoip/dbip-country-lite.mmdb only when it changed (atomic rename). Compose mounts that folder
      # read-only into the backend (GEOIP_DB_PATH), which reloads a changed file by itself: no restart needed.
      # A failed download only warns; the server keeps the file it has.
      - name: geoip database
        env:
          GEOIP_URL_PREFIX: https://download.db-ip.com/free/dbip-country-lite-
        run: |
          remote="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          # the backend container user must be able to read it, whatever the SSH session umask is
          if ! ssh "$remote" 'mkdir -p /opt/saadat/geoip && chmod 755 /opt/saadat/geoip'; then
            echo "::warning::cannot create /opt/saadat/geoip on the server: GeoIP database not updated"; exit 0
          fi
          work=$(mktemp -d)
          marker=$(printf '\xab\xcd\xefMaxMind.com')
          month=""
          for m in "$(date -u +%Y-%m)" "$(date -u -d "$(date -u +%Y-%m-15) -1 month" +%Y-%m)"; do
            rm -f "$work/db.mmdb.gz" "$work/db.mmdb" "$work/tail.bin"
            if curl -fsSL --retry 3 --retry-delay 10 --connect-timeout 20 --max-time 300 \
                -o "$work/db.mmdb.gz" "${GEOIP_URL_PREFIX}${m}.mmdb.gz" \
              && gzip -t "$work/db.mmdb.gz" \
              && gunzip -c "$work/db.mmdb.gz" > "$work/db.mmdb" \
              && [ -s "$work/db.mmdb" ] \
              && tail -c 131072 "$work/db.mmdb" > "$work/tail.bin" \
              && LC_ALL=C grep -qaF "$marker" "$work/tail.bin"; then
              month=$m
              break
            fi
            echo "GeoIP database for $m: not available or not valid"
          done
          if [ -z "$month" ]; then
            echo "::warning::GeoIP database could not be downloaded; the server keeps its current file"; exit 0
          fi
          sum=$(sha256sum "$work/db.mmdb" | cut -d' ' -f1)
          current=$(ssh "$remote" "sha256sum /opt/saadat/geoip/dbip-country-lite.mmdb 2>/dev/null | cut -d' ' -f1")
          if [ "$sum" = "$current" ]; then
            echo "GeoIP database $month already on the server"; exit 0
          fi
          # upload compressed, unpack next to the live file, compare checksums, then rename over it (atomic)
          uploaded=$(ssh "$remote" "cd /opt/saadat/geoip && gunzip -c > .dbip-country-lite.mmdb.tmp \
            && sha256sum .dbip-country-lite.mmdb.tmp | cut -d' ' -f1" < "$work/db.mmdb.gz" || true)
          if [ "$uploaded" != "$sum" ] || ! ssh "$remote" "cd /opt/saadat/geoip && chmod 644 .dbip-country-lite.mmdb.tmp \
            && mv -f .dbip-country-lite.mmdb.tmp dbip-country-lite.mmdb"; then
            ssh "$remote" 'rm -f /opt/saadat/geoip/.dbip-country-lite.mmdb.tmp' || true
            echo "::warning::GeoIP upload failed; the server keeps its current file"; exit 0
          fi
          echo "GeoIP database $month installed ($(du -h "$work/db.mmdb" | cut -f1), sha256 $sum)"
      # Web push: the VAPID key pair is generated ON THE SERVER the first time (deploy/ops/vapid-keys.sh, openssl
      # P-256) and never replaced; the private key stays in backend.env on the VPS and is never printed. The frontend
      # reads the public key at runtime from GET /api/public/push-key.
      - name: push notification keys
        env:
          VAPID_CONTACT: ${{ vars.SMTP_USERNAME || 'support@saadatu-aldarein.com' }}
        run: |
          if ! [[ "$VAPID_CONTACT" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$ ]]; then
            echo "::warning::push keys skipped: '$VAPID_CONTACT' is not a plain e-mail address"; exit 0
          fi
          # shellcheck disable=SC2029  # the validated contact is passed as an argument of the remote command
          if result=$(ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/vapid-keys.sh $VAPID_CONTACT"); then
            echo "push keys: $result"   # generated <public key> | subject-set | exists
          else
            echo "::warning::push keys could not be generated on the server (web push stays off)"
          fi
      # Kashier (Egypt, EGP): KASHIER_MERCHANT_ID, KASHIER_API_KEY, KASHIER_SECRET_KEY come from GitHub secrets of the
      # same names, KASHIER_MODE from the repository variable (test | live, default test); all are written to
      # backend.env (stdin only). Real payments start (PAYMENTS_MOCK=false) only when the three secrets are set AND the
      # repository variable PAYMENTS_LIVE is "true"; otherwise the current mock setting is left as it is.
      - name: kashier settings
        env:
          KASHIER_MERCHANT_ID: ${{ secrets.KASHIER_MERCHANT_ID }}
          KASHIER_API_KEY: ${{ secrets.KASHIER_API_KEY }}
          KASHIER_SECRET_KEY: ${{ secrets.KASHIER_SECRET_KEY }}
          KASHIER_MODE: ${{ vars.KASHIER_MODE || 'test' }}
          PAYMENTS_LIVE: ${{ vars.PAYMENTS_LIVE || 'false' }}
        run: |
          lines=""
          count=0
          for name in KASHIER_MERCHANT_ID KASHIER_API_KEY KASHIER_SECRET_KEY; do
            value=${!name}
            value="${value#"${value%%[![:space:]]*}"}"   # trim (pasted secrets often end with a newline)
            value="${value%"${value##*[![:space:]]}"}"
            [ -z "$value" ] && continue
            case "$value" in *"'"*|*[[:space:]]*)
              echo "::warning::secret $name must not contain quotes or spaces: Kashier settings not changed"; exit 0;;
            esac
            lines+="$name='$value'"$'\n'
            count=$((count + 1))
          done
          if [ -z "$lines" ]; then
            echo "no KASHIER_* secrets: payment settings not changed"; exit 0
          fi
          case "$KASHIER_MODE" in test|live) ;; *)
            echo "::warning::variable KASHIER_MODE must be test or live: Kashier settings not changed"; exit 0;;
          esac
          lines+="KASHIER_MODE=$KASHIER_MODE"$'\n'
          live=no
          if [ "$PAYMENTS_LIVE" = "true" ]; then
            if [ "$count" -eq 3 ]; then
              lines+="PAYMENTS_MOCK=false"$'\n'
              live=yes
            else
              echo "::warning::PAYMENTS_LIVE is true but only $count of the 3 KASHIER_* secrets are set: payment mode not changed"
            fi
          fi
          result=$(printf '%s' "$lines" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/backend.env")
          echo "kashier settings: $result ($count of 3 secrets set; mode $KASHIER_MODE; PAYMENTS_MOCK=false written: $live)"
          if [ "$result" = "updated" ]; then
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "touch /opt/saadat/deploy/.recreate-backend"
          fi
      - name: build & restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s <<'EOS'
            set -e
            cd /opt/saadat/deploy
            test -f .env || { echo "missing /opt/saadat/deploy/.env"; exit 1; }
            docker compose --env-file .env build --pull
            docker compose --env-file .env up -d --remove-orphans
            if [ -f .recreate-backend ]; then docker compose --env-file .env up -d --no-deps --force-recreate backend; rm -f .recreate-backend; fi
            # Caddy reads its (bind-mounted) Caddyfile only at start: when the file changed, validate it first, then restart
            # Caddy so it picks up the new file. An invalid file fails the deploy and the running proxy keeps its old config.
            if ! docker compose --env-file .env exec -T caddy cat /etc/caddy/Caddyfile | cmp -s - Caddyfile; then
              DOMAIN=$(grep -m1 '^DOMAIN=' .env | cut -d= -f2-); ACME_EMAIL=$(grep -m1 '^ACME_EMAIL=' .env | cut -d= -f2-); export DOMAIN ACME_EMAIL
              docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
                caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
              docker compose --env-file .env restart caddy
              echo "caddy: new Caddyfile applied"
            fi
            docker image prune -f >/dev/null
            docker compose --env-file .env ps
          EOS
      - name: smoke test
        run: |
          DOMAIN=$(ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "grep ^DOMAIN= /opt/saadat/deploy/.env | cut -d= -f2")
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/" || true)
            [ "$code" = "200" ] && echo "OK https://$DOMAIN" && exit 0
            sleep 10
          done
          echo "site not responding (got $code)"; exit 1
      # After the mail settings change: wait for the API, then ask for a sign-in code to the site mailbox so the
      # delivery can be checked in that inbox.
      - name: mail test
        if: ${{ steps.mail.outputs.changed == 'true' }}
        env:
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'support@saadatu-aldarein.com' }}
        run: |
          for i in $(seq 1 24); do
            curl -s "https://$DOMAIN/api/actuator/health" | grep -q '"UP"' && break
            sleep 10
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$DOMAIN/api/auth/magic/request" \
            -H 'Content-Type: application/json' -H 'Accept-Language: ar' -d "{\"email\":\"$SMTP_USERNAME\"}")
          echo "sign-in code requested for $SMTP_USERNAME (HTTP $code)"
