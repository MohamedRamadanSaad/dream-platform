mail.payment-receipt.subject=إيصال الدفع — {packageName}
mail.payment-receipt.preheader=شكراً لك، تمت إضافة الرصيد إلى حسابك.
mail.payment-suspicious.subject=طلب دفع يحتاج إلى مراجعة {orderRef}
