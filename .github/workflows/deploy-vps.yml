name: deploy-vps
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: deploy-vps, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: "${{ secrets.VPS_SSH_KEY }}" }
      - name: trust host
        run: mkdir -p ~/.ssh && ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: sync sources
        run: |
          tar czf - --exclude=node_modules --exclude=dist --exclude=.git frontend deploy backend 2>/dev/null \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/saadat && tar xzf - -C /opt/saadat"
      # Settings written into the server env files IN PLACE by deploy/ops/setenv.sh (values via SSH stdin, never on a
      # command line; unchanged values = no restart, no test e-mail).
      # Site e-mail: the mailbox password lives only in the GitHub secret SMTP_PASSWORD; host/user can be overridden
      # with repository variables.
      - name: mail settings
        id: mail
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.hostinger.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'support@saadatu-aldarein.com' }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then echo "secret SMTP_PASSWORD not set: e-mails stay in the backend log"; exit 0; fi
          case "$SMTP_PASSWORD" in *"'"*) echo "SMTP_PASSWORD must not contain a single quote"; exit 1;; esac
          result=$(printf "SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USERNAME=%s\nSMTP_PASSWORD='%s'\nSMTP_AUTH=true\nSMTP_STARTTLS=true\nMAIL_FROM=%s\n" \
              "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USERNAME" "$SMTP_PASSWORD" "$SMTP_USERNAME" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/backend.env")
          echo "mail settings: $result"
          if [ "$result" = "updated" ]; then
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "touch /opt/saadat/deploy/.recreate-backend"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Google sign-in: the OAuth web client ID is public (it ships in the frontend bundle). Backend verifies ID tokens
      # against it (GOOGLE_CLIENT_ID); the frontend gets it at build time (VITE_GOOGLE_CLIENT_ID).
      # Access: INTERPRETER_EMAILS (extra interpreter e-mails) comes only from the repository variable of the same
      # name — empty by default, so only addresses on the site domain get the dashboard.
      - name: google sign-in and access settings
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '957021915232-jaan66ks1mq88nj60add9gbjlc7jsb0g.apps.googleusercontent.com' }}
          INTERPRETER_EMAILS: ${{ vars.INTERPRETER_EMAILS || '' }}
        run: |
          backend=$(printf "GOOGLE_CLIENT_ID=%s\nINTERPRETER_EMAILS=%s\n" "$GOOGLE_CLIENT_ID" "$INTERPRETER_EMAILS" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/backend.env")
          echo "backend access settings: $backend"
          [ "$backend" = "updated" ] && ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "touch /opt/saadat/deploy/.recreate-backend"
          frontend=$(printf "VITE_GOOGLE_CLIENT_ID=%s\n" "$GOOGLE_CLIENT_ID" \
            | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /opt/saadat/deploy/ops/setenv.sh /opt/saadat/deploy/.env")
          echo "frontend build settings: $frontend"
      - name: build & restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s <<'EOS'
            set -e
            cd /opt/saadat/deploy
            test -f .env || { echo "missing /opt/saadat/deploy/.env"; exit 1; }
            docker compose --env-file .env build --pull
            docker compose --env-file .env up -d --remove-orphans
            if [ -f .recreate-backend ]; then docker compose --env-file .env up -d --no-deps --force-recreate backend; rm -f .recreate-backend; fi
            docker image prune -f >/dev/null
            docker compose --env-file .env ps
          EOS
      - name: smoke test
        run: |
          DOMAIN=$(ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "grep ^DOMAIN= /opt/saadat/deploy/.env | cut -d= -f2")
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/" || true)
            [ "$code" = "200" ] && echo "OK https://$DOMAIN" && exit 0
            sleep 10
          done
          echo "site not responding (got $code)"; exit 1
      # After the mail settings change: wait for the API, then ask for a sign-in code to the site mailbox so the
      # delivery can be checked in that inbox.
      - name: mail test
        if: ${{ steps.mail.outputs.changed == 'true' }}
        env:
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'support@saadatu-aldarein.com' }}
        run: |
          for i in $(seq 1 24); do
            curl -s "https://$DOMAIN/api/actuator/health" | grep -q '"UP"' && break
            sleep 10
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$DOMAIN/api/auth/magic/request" \
            -H 'Content-Type: application/json' -H 'Accept-Language: ar' -d "{\"email\":\"$SMTP_USERNAME\"}")
          echo "sign-in code requested for $SMTP_USERNAME (HTTP $code)"
