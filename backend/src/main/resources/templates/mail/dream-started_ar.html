<!DOCTYPE html>
<!--/* dream-started (ar) — copy is literal here (per-locale file); subject + preheader: messages mail.dream-started.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}">
<head><title>dream-started</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">السلام عليكم<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>،</p>
  <p style="margin:0 0 16px 0;">بدأت المعبّرة الآن تعبير رؤياك، وصار نص الرؤيا نهائياً.</p>
  <p style="margin:0 0 16px 0;" th:if="${!#strings.isEmpty(expectedDays)}">عدد الأيام المتوقعة: <strong th:text="${expectedDays}">—</strong></p>
  <p style="margin:0 0 16px 0;" th:if="${!#strings.isEmpty(expectedBy)}">الموعد المتوقع للتفسير: <strong th:text="${expectedBy}">—</strong></p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;">قد تصلك أسئلة تساعد على دقة التفسير، فنرجو متابعة حسابك.</p>
  <p style="margin:0 0 16px 0;">سيصلك إشعار حين يكون التفسير جاهزاً في حسابك.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'متابعة رؤياك')}"></table>
</div>
</body>
</html>
