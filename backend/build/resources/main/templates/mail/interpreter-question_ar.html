<!DOCTYPE html>
<!--/* interpreter-question (ar) — copy is literal here (per-locale file); subject + preheader: messages mail.interpreter-question.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}">
<head><title>interpreter-question</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">السلام عليكم<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>،</p>
  <p style="margin:0 0 16px 0;">أرسلت المعبّرة استفساراً بخصوص رؤياك. الإجابة عنه تساعد على أن يكون التفسير أدق وأقرب إلى حالك.</p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;">يتوقف احتساب مدة التفسير حتى يصل ردك، ثم يُستكمل من حيث توقف.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'قراءة الاستفسار والرد')}"></table>
</div>
</body>
</html>
