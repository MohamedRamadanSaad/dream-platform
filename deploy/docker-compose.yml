# Production stack on the Hostinger VPS. Caddy terminates TLS and routes:
#   https://$DOMAIN        -> frontend (nginx, static SPA)
#   https://$DOMAIN/api/*  -> backend (Spring Boot)  [enabled once backend/ exists]
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    expose: ["80"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreams}
      POSTGRES_USER: ${POSTGRES_USER:-dreams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # loopback only: reachable from the server itself (and an SSH tunnel), never from the internet
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dreams} -d ${POSTGRES_DB:-dreams}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: backend.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dreams}
      DB_USERNAME: ${POSTGRES_USER:-dreams}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Visitor country without Cloudflare: DB-IP "IP to Country Lite", refreshed by deploy-vps.yml (monthly).
      # A missing file = no lookups (CF-IPCountry, else setting pricing.default_country).
      GEOIP_DB_PATH: /geoip/dbip-country-lite.mmdb
    volumes:
      - /opt/saadat/geoip:/geoip:ro
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s

volumes:
  caddy_data:
  caddy_config:
  pg_data:
