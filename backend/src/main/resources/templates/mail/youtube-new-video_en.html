<!DOCTYPE html>
<!--/* youtube-new-video (en) — copy is literal here (per-locale file); subject + preheader: messages mail.youtube-new-video.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>youtube-new-video</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">Assalamu alaikum<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;">A new video is now on the channel:</p>
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;" th:text="${videoTitle}">Title</p>
  <p style="margin:0 0 16px 0;" th:if="${!#strings.isEmpty(thumbnailUrl)}"><a th:href="${videoUrl}"><img th:src="${thumbnailUrl}" th:alt="${videoTitle}" width="100%" style="display:block;width:100%;max-width:528px;height:auto;border:0;border-radius:12px;" alt=""></a></p>
  <table th:replace="~{mail/_layout :: cta(${videoUrl}, 'Watch the video')}"></table>
</div>
</body>
</html>
