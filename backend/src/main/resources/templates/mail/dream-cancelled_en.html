<!DOCTYPE html>
<!--/* dream-cancelled (en) — all copy from messages mail.dream-cancelled.* / mail.label.* / mail.common.*; subject + preheader: mail.dream-cancelled.subject/.preheader */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>dream-cancelled</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;"><span th:text="#{mail.common.greeting}">Greeting</span><th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;" th:text="#{mail.dream-cancelled.line1}">…</p>
  <p style="margin:0 0 16px 0;" th:if="${refunded != null and refunded}" th:text="#{mail.dream-cancelled.refunded}">…</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 16px 0;border-collapse:collapse;background-color:#FFFFFF;border:1px solid #E6DCC8;border-radius:12px;">
    <tr th:if="${!#strings.isEmpty(excerpt)}">
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.dream}">Label</td>
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${excerpt}">—</td>
    </tr>
    <tr th:if="${!#strings.isEmpty(reason)}">
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.reason}">Label</td>
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${reason}">—</td>
    </tr>
    <tr th:if="${balance != null}">
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.balance}">Label</td>
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${balance}">—</td>
    </tr>
  </table>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, #{mail.dream-cancelled.cta})}"></table>
</div>
</body>
</html>
