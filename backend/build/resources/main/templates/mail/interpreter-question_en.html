<!DOCTYPE html>
<!--/* interpreter-question (en) — copy is literal here (per-locale file); subject + preheader: messages mail.interpreter-question.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>interpreter-question</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">Assalamu alaikum<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;">The interpreter has a question about your dream. Your answer helps make the interpretation more accurate and closer to your situation.</p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;">The waiting time is paused until you reply, then it continues from where it stopped.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'Read and reply')}"></table>
</div>
</body>
</html>
