<!DOCTYPE html>
<!--/* testimonial-request (en) — copy is literal here (per-locale file); subject + preheader: messages mail.testimonial-request.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>testimonial-request</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">Assalamu alaikum<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;">We hope the interpretation was helpful. If you like, share your rating in a minute; your opinion helps us improve and reassures others.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'Share your rating')}"></table>
  <p style="margin:18px 0 0 0;font-size:13px;line-height:1.8;color:#5B6478;">Rating is entirely optional and is only published after review.</p>
</div>
</body>
</html>
