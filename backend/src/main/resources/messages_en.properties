# English texts (UTF-8). Placeholders are NAMED: {key} is filled from the args/model map by
# com.saadat.mail.MessageText (messages are read raw — no MessageFormat, so apostrophes need no escaping).

# ---------------------------------------------------------------- in-app notifications: notif.<TYPE>.title/body
# args: userName (the dreamer, interpreter-facing types), credits, packageName, promotionName
notif.DREAM_SUBMITTED.title=New dream in the queue
notif.DREAM_SUBMITTED.body={userName} submitted a new dream; it is now in the review queue.
notif.DREAM_RECEIVED.title=Your dream has arrived
notif.DREAM_RECEIVED.body=We will study it carefully and let you know when the interpretation is ready.
notif.INTERPRETER_QUESTION.title=A question from the interpreter
notif.INTERPRETER_QUESTION.body=The interpreter has a question about your dream. Please reply so the interpretation can be completed.
notif.USER_REPLIED.title=Reply to your question
notif.USER_REPLIED.body={userName} replied to your question; the dream is back in the review queue.
notif.INTERPRETATION_READY.title=Your dream has been interpreted
notif.INTERPRETATION_READY.body=The interpretation is now ready in your account.
notif.PAYMENT_SUCCESS.title=Payment successful
notif.PAYMENT_SUCCESS.body={credits} dream credits were added to your balance.
notif.PROMOTION.title=A new offer
notif.PROMOTION.body={promotionName}

# ---------------------------------------------------------------- e-mail subjects and preheaders: mail.<template>.*
mail.magic-link.subject=Your sign-in link for {brandName}
mail.magic-link.preheader=Your code is valid for {ttlMinutes} minutes and can be used once.
mail.dream-received.subject=Your dream has arrived
mail.dream-received.preheader=We will study it carefully and let you know when the interpretation is ready.
mail.interpreter-question.subject=A question about your dream
mail.interpreter-question.preheader=The interpreter sent a question that helps make the interpretation accurate.
mail.user-replied.subject=New reply from {userName}
mail.user-replied.preheader=Your question was answered and the dream is back in the review queue.
mail.interpretation-ready.subject=Your interpretation is ready
mail.interpretation-ready.preheader=You can read the interpretation in your account now.
mail.payment-receipt.subject=Payment receipt — {packageName}
mail.payment-receipt.preheader=Thank you. The credits were added to your account.
mail.payment-suspicious.subject=Payment needs review {orderRef}
mail.payment-suspicious.preheader=No credits were added for this order until it is reviewed.
mail.reply-reminder.subject=Reminder: the interpreter is waiting for your reply
mail.reply-reminder.preheader=Your reply helps complete the interpretation of your dream.
mail.testimonial-request.subject=How was your experience?
mail.testimonial-request.preheader=Your opinion helps us improve and reassures others.
mail.interpreter-digest.subject=Today: {waiting} waiting for interpretation
mail.interpreter-digest.preheader={overdue} of them are past the expected time.
mail.dream-submitted.subject=New dream from {userName}
mail.dream-submitted.preheader=A new dream was added to the review queue.
mail.youtube-new-video.subject=New video: {videoTitle}
mail.youtube-new-video.preheader=A new video is now on the channel.

# ---------------------------------------------------------------- shared layout strings
mail.button.fallback=If the button does not work, copy this link into your browser:
mail.footer.youtube=Watch the channel on YouTube
mail.footer.support=Questions? Write to
mail.footer.note=You received this message because it concerns your account with us.

notif.YOUTUBE_VIDEO.title=New video on the channel
notif.YOUTUBE_VIDEO.body={title}
