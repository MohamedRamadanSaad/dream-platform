# ---------------------------------------------------------------- insights: insight.<rule>.title/body (GET /admin/analytics/insights)
insight.overdue.title=رؤى تجاوزت الموعد المتوقع
insight.overdue.body=عدد الرؤى التي تجاوزت موعد الرد المتوقع: {count}. يُستحسن البدء بالأقدم حتى لا يطول انتظار أحد.
insight.awaiting-reply.title=أصحاب رؤى لم يردّوا بعد
insight.awaiting-reply.body=عدد الرؤى التي تنتظر رد أصحابها منذ أكثر من {days} أيام: {count}.
insight.busy-on.title=يُستحسن تفعيل وضع الانشغال
insight.busy-on.body=عدد الرؤى في قائمة المراجعة: {count}، وهو أكثر مما يُنجز عادةً خلال مدة الرد الحالية. تفعيل وضع الانشغال يعرض على المستخدمين مدة انتظار أطول وأدق.
insight.busy-off.title=يمكن إيقاف وضع الانشغال
insight.busy-off.body=قائمة المراجعة صغيرة الآن (عدد الرؤى: {count})، ويمكن العودة إلى مدة الرد المعتادة.
insight.testimonials-pending.title=آراء بانتظار الموافقة
insight.testimonials-pending.body=عدد الآراء التي تنتظر الموافقة: {count}. تظهر الآراء في الصفحة الرئيسية بعد الموافقة عليها.
insight.traffic-up.title=زيارات أكثر هذا الشهر
insight.traffic-up.body=زادت الزيارات بنسبة {percent}% مقارنةً بالأيام نفسها من الشهر الماضي.
insight.traffic-down.title=زيارات أقل هذا الشهر
insight.traffic-down.body=انخفضت الزيارات بنسبة {percent}% مقارنةً بالأيام نفسها من الشهر الماضي. قد يساعد نشر مقطع جديد على عودة الزوار.
insight.peak-hours.title=التفسير في وقت نشاط المستخدمين
insight.peak-hours.body=يكون المستخدمون أكثر نشاطاً قرب الساعة {hour}، والتفسير في هذا الوقت يجعل الرد يبدو أسرع.
insight.youtube-time.title=أنسب وقت لنشر مقطع
insight.youtube-time.body=أنسب وقت لنشر المقطع القادم على يوتيوب هو يوم {day} قرب الساعة {hour}، حين يكون أغلب الزوار في الموقع.
insight.country-price.title=زيارات بلا مدفوعات من {country}
insight.country-price.body=تأتي أكثر الزيارات من {country}، لكن لم يُسجَّل منها أي طلب مدفوع خلال آخر 30 يوماً. يُستحسن مراجعة السعر هناك.
insight.fast-response.title=ردود سريعة
insight.fast-response.body=متوسط مدة الرد خلال آخر 30 يوماً {hours} ساعة، وهو أقل من نصف مدة الرد المحددة ({sla} ساعة).
insight.streak.title=تفسير متواصل
insight.streak.body=عدد الأيام المتتالية التي فُسِّرت فيها رؤى: {days}. بارك الله في الجهد.
insight.interpreted-up.title=تفسيرات أكثر هذا الشهر
insight.interpreted-up.body=عدد الرؤى المفسَّرة هذا الشهر: {count}، مقابل {previous} في الشهر الماضي.

