<!DOCTYPE html>
<!--/* payment-failed (en) — all copy from messages mail.payment-failed.* / mail.label.* / mail.common.*; subject + preheader: mail.payment-failed.subject/.preheader */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>payment-failed</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;"><span th:text="#{mail.common.greeting}">Greeting</span><th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;" th:text="#{mail.payment-failed.line1}">…</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 16px 0;border-collapse:collapse;background-color:#FFFFFF;border:1px solid #E6DCC8;border-radius:12px;">
    <tr th:if="${!#strings.isEmpty(packageName)}">
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.package}">Label</td>
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" th:text="${packageName}">—</td>
    </tr>
    <tr th:if="${amount != null}">
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.amount}">Label</td>
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" dir="ltr" th:text="|${amount} ${currency}|">—</td>
    </tr>
    <tr th:if="${!#strings.isEmpty(orderRef)}">
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:14px;color:#5B6478;width:40%;" th:text="#{mail.label.order}">Label</td>
      <td align="left" style="padding:10px 16px;border-bottom:1px solid #F0E9DC;font-size:15px;font-weight:600;color:#0A1128;" dir="ltr" th:text="${orderRef}">—</td>
    </tr>
  </table>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;" th:text="#{mail.payment-failed.line2}">…</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, #{mail.payment-failed.cta})}"></table>
</div>
</body>
</html>
