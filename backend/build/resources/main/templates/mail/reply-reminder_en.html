<!DOCTYPE html>
<!--/* reply-reminder (en) — copy is literal here (per-locale file); subject + preheader: messages mail.reply-reminder.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('ltr', 'en', ~{::content})}">
<head><title>reply-reminder</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">Assalamu alaikum<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>,</p>
  <p style="margin:0 0 16px 0;">The interpreter is still waiting for your answer to her question about your dream. Your reply helps complete the interpretation.</p>
  <p style="margin:0 0 16px 0;font-size:14px;line-height:1.8;color:#5B6478;">Take your time; the interpretation continues as soon as your reply arrives.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'Reply now')}"></table>
</div>
</body>
</html>
