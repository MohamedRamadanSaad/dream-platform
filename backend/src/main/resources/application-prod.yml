# Production. All secrets from env; mocks are forced off (ProductionSafetyCheck enforces it).

sentry:
  environment: ${SENTRY_ENVIRONMENT:prod}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  auth:
    allow-mock: false
    refresh-cookie-secure: true
  payments:
    mock: false
