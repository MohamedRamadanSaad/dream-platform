<!DOCTYPE html>
<!--/* testimonial-request (ar) — copy is literal here (per-locale file); subject + preheader: messages mail.testimonial-request.* */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}">
<head><title>testimonial-request</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;">السلام عليكم<th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>،</p>
  <p style="margin:0 0 16px 0;">نرجو أن يكون التفسير قد أفادك. إن أحببت، شاركنا تقييمك في دقيقة؛ رأيك يساعدنا على التحسين، ويطمئن غيرك.</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, 'مشاركة التقييم')}"></table>
  <p style="margin:18px 0 0 0;font-size:13px;line-height:1.8;color:#5B6478;">التقييم اختياري تماماً، ولا يُنشر إلا بعد مراجعته.</p>
</div>
</body>
</html>
