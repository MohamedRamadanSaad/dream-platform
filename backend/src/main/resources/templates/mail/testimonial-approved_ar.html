<!DOCTYPE html>
<!--/* testimonial-approved (ar) — all copy from messages mail.testimonial-approved.* / mail.label.* / mail.common.*; subject + preheader: mail.testimonial-approved.subject/.preheader */-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout('rtl', 'ar', ~{::content})}">
<head><title>testimonial-approved</title></head>
<body>
<div th:fragment="content">
  <p style="margin:0 0 18px 0;font-size:18px;line-height:1.7;font-weight:600;color:#0A1128;"><span th:text="#{mail.common.greeting}">Greeting</span><th:block th:if="${!#strings.isEmpty(name)}"> <span th:text="${name}">…</span></th:block>،</p>
  <p style="margin:0 0 16px 0;" th:text="#{mail.testimonial-approved.line1}">…</p>
  <p style="margin:0 0 16px 0;padding:14px 18px;background-color:#FFFFFF;border:1px solid #E6DCC8;border-radius:12px;font-size:15px;line-height:1.8;color:#0A1128;" th:if="${!#strings.isEmpty(comment)}" dir="auto" th:text="${comment}">…</p>
  <table th:replace="~{mail/_layout :: cta(${ctaUrl}, #{mail.testimonial-approved.cta})}"></table>
</div>
</body>
</html>
