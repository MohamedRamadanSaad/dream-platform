<!doctype html>
<!--
  E-mail theme image generator. Open with ?theme=<key>&part=header|footer (header 1200x360: moon, stars, meteors;
  footer 1200x300: stars only). theme-image-generator.js screenshots every theme into
  frontend/public/email/themes/<key>/{header,footer}.jpg. To add a theme: add an entry to THEMES below and to
  backend/src/main/resources/mail/themes.json, then run: node deploy/mail/theme-image-generator.js frontend/public/email/themes
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const THEMES = {
  // sky: vertical gradient stops (top → bottom); glow: radial light (x, y in 0..1, colour); horizon: warm band at the bottom
  'crescent-night': { seed: 7,  sky: ['#24386b', '#16244a', '#0a1128'], glow: [.85, .2, '#2e4a8a', .55], stars: ['#f4efe6', '#f4efe6', '#d4af37'],
                      moon: { kind: 'crescent', x: 1040, y: 110, r: 66, color: '#f4e9cf' }, meteors: 2, meteor: '#ffffff' },
  'rose-dawn':      { seed: 19, sky: ['#3a3058', '#5e4a7c', '#9a7590'], glow: [.2, .95, '#e9a99a', .4], horizon: '#e8a99c', stars: ['#fff6f2', '#ffe1d6', '#f7d9e4'],
                      moon: { kind: 'crescent', x: 160, y: 105, r: 50, color: '#fff3ea' }, meteors: 1, meteor: '#fff2ee', starScale: .8 },
  'sea-breeze':     { seed: 31, sky: ['#0b2f38', '#14505a', '#2f7f7a'], glow: [.82, .3, '#5fb3a8', .35], horizon: '#7cc9bd', stars: ['#eafaf6', '#bfeee4', '#ffffff'],
                      moon: { kind: 'full', x: 1035, y: 115, r: 62, color: '#f0fbf8', crater: '#bfded6' }, meteors: 2, meteor: '#e8fffa' },
  'lavender-night': { seed: 43, sky: ['#1f1840', '#3a2c6b', '#5a4592'], glow: [.18, .3, '#9a7fd6', .45], stars: ['#f3eeff', '#d9c9ff', '#ffffff'],
                      moon: { kind: 'gibbous', x: 170, y: 120, r: 60, color: '#f5eeff' }, meteors: 3, meteor: '#efe6ff' },
  'desert-dusk':    { seed: 59, sky: ['#2a2240', '#523a52', '#96603f'], glow: [.8, .98, '#e09a5a', .45], horizon: '#e0955a', stars: ['#fff5e8', '#ffe2b8', '#fff5e8'],
                      moon: { kind: 'crescent', x: 1050, y: 95, r: 52, color: '#fff2df' }, meteors: 1, meteor: '#fff1dc', dunes: '#3a2530', starScale: .85 },
  'emerald-night':  { seed: 71, sky: ['#123f33', '#0d2e25', '#081d17'], glow: [.15, .25, '#2a6b55', .5], stars: ['#eef5ef', '#d9bc6a', '#d9bc6a'],
                      moon: { kind: 'crescent', x: 150, y: 115, r: 66, color: '#ead9a0' }, meteors: 2, meteor: '#f3e2a8' },
  'winter-sky':     { seed: 83, sky: ['#2a3550', '#3d4c69', '#5a6d8c'], glow: [.84, .3, '#a9bcd8', .35], stars: ['#eef3f8', '#d6e2f0', '#ffffff'],
                      moon: { kind: 'full', x: 1045, y: 118, r: 58, color: '#eef3f8', crater: '#c9d4e2', halo: true }, meteors: 1, meteor: '#f2f7ff' },
  'calm-morning':   { seed: 97, sky: ['#bcd6ea', '#dde9f3', '#f8efdf'], glow: [.85, .25, '#ffffff', .7], horizon: '#f6dfb8', stars: ['#6f86a8', '#9aaecb', '#c9a35a'],
                      moon: { kind: 'full', x: 1040, y: 110, r: 54, color: '#fdfdfb', crater: '#c7d3e2', outline: '#9fb3cc' }, meteors: 1, meteor: '#7f95b5', light: true, starScale: .7 },
};
const P = new URLSearchParams(location.search);
const theme = P.get('theme'), part = P.get('part');
const T = THEMES[theme];
const W = 1200, H = part === 'header' ? 360 : 300;
const s = document.getElementById('s'); s.setAttribute('width', W); s.setAttribute('height', H);
const NS = 'http://www.w3.org/2000/svg';
let seed = T.seed + (part === 'footer' ? 1000 : 0);
const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const add = (t, a, p = s) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e };
const sky = part === 'header' ? T.sky : [T.sky[2], T.sky[1], T.sky[0]].map((c, i) => i === 0 ? T.sky[1] : c);
const defs = add('defs', {});
defs.innerHTML = `
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">${(part === 'header' ? T.sky : [T.sky[1], T.sky[0], T.sky[0]]).map((c, i, a) => `<stop offset="${i / (a.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient>
<radialGradient id="g1" cx="${T.glow[0]}" cy="${T.glow[1]}" r=".7"><stop offset="0" stop-color="${T.glow[2]}" stop-opacity="${T.glow[3]}"/><stop offset="1" stop-color="${T.glow[2]}" stop-opacity="0"/></radialGradient>
<linearGradient id="hor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.horizon || '#000'}" stop-opacity="0"/><stop offset="1" stop-color="${T.horizon || '#000'}" stop-opacity=".5"/></linearGradient>
<radialGradient id="mglow"><stop offset="0" stop-color="${T.moon.color}" stop-opacity="${T.light ? .9 : .5}"/><stop offset=".45" stop-color="${T.moon.color}" stop-opacity="${T.light ? .35 : .14}"/><stop offset="1" stop-color="${T.moon.color}" stop-opacity="0"/></radialGradient>
<radialGradient id="sglow"><stop offset="0" stop-color="${T.light ? '#ffffff' : '#ffffff'}" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="moon" cx=".38" cy=".36"><stop offset="0" stop-color="#ffffff"/><stop offset=".75" stop-color="${T.moon.color}"/><stop offset="1" stop-color="${T.moon.crater || T.moon.color}"/></radialGradient>
<linearGradient id="met" x1="0" x2="1"><stop offset="0" stop-color="${T.meteor}" stop-opacity="0"/><stop offset="1" stop-color="${T.meteor}" stop-opacity=".95"/></linearGradient>
<mask id="cut"><rect width="${W}" height="${H}" fill="white"/><circle cx="${T.moon.x + (T.moon.kind === 'gibbous' ? -T.moon.r * 1.25 : -T.moon.r * .55) * (T.moon.x > 600 ? 1 : -1)}" cy="${T.moon.y - T.moon.r * .25}" r="${T.moon.r * (T.moon.kind === 'gibbous' ? 1 : .92)}" fill="black"/></mask>`;
add('rect', { width: W, height: H, fill: 'url(#sky)' });
add('rect', { width: W, height: H, fill: 'url(#g1)' });
if (T.horizon && part === 'header') add('rect', { y: H * .5, width: W, height: H * .5, fill: 'url(#hor)' });

// keep the middle calm: text is written on top of the image
const calm = (x, y) => part === 'header' ? (x > 300 && x < 900 && y > 110 && y < 290) : (x > 200 && x < 1000 && y > 50 && y < 260);
const nearMoon = (x, y) => part === 'header' && Math.hypot(x - T.moon.x, y - T.moon.y) < T.moon.r * 1.8;
const sc = T.starScale || 1;
for (let i = 0; i < (part === 'header' ? 240 : 190) * sc; i++) {
  const x = r() * W, y = r() * H; if (nearMoon(x, y)) continue;
  add('circle', { cx: x, cy: y, r: r() * 1.3 + .3, fill: T.stars[i % 3], opacity: (calm(x, y) ? .35 : 1) * (r() * .5 + (T.light ? .15 : .12)) });
}
const star = (x, y, R, o, c) => {
  const p = []; for (let i = 0; i < 8; i++) { const a = Math.PI / 4 * i - Math.PI / 2, rr = i % 2 ? R * .27 : R; p.push((x + Math.cos(a) * rr).toFixed(1) + ',' + (y + Math.sin(a) * rr).toFixed(1)) }
  if (!T.light) add('circle', { cx: x, cy: y, r: R * 1.9, fill: 'url(#sglow)', opacity: o * .35 });
  add('polygon', { points: p.join(' '), fill: c, opacity: o });
};
let n = 0; const N = Math.round((part === 'header' ? 42 : 32) * sc);
while (n < N) {
  const x = r() * W, y = r() * H; if (nearMoon(x, y)) continue;
  const c = calm(x, y); if (c && r() < .75) continue; n++;
  star(x, y, c ? 2.5 + r() * 2 : (r() < .16 ? 9 + r() * 6 : 3 + r() * 4.5), c ? .45 : r() * .45 + (T.light ? .35 : .5), T.stars[Math.floor(r() * 3)]);
}
if (part === 'header') {
  if (T.dunes) {
    add('path', { d: `M0 ${H} L0 300 C 180 270 320 285 480 305 S 820 270 980 292 S 1150 300 1200 288 L1200 ${H} Z`, fill: T.dunes, opacity: .55 });
    add('path', { d: `M0 ${H} L0 330 C 220 312 420 322 600 334 S 950 315 1200 326 L1200 ${H} Z`, fill: T.dunes, opacity: .85 });
  }
  const met = (x, y, l, ang, o) => { const g = add('g', { transform: `translate(${x},${y}) rotate(${ang})`, opacity: o }); add('rect', { x: -l, y: -1.2, width: l, height: 2.4, rx: 1.2, fill: 'url(#met)' }, g); add('circle', { r: 2.6, fill: T.meteor }, g); if (!T.light) add('circle', { r: 9, fill: 'url(#sglow)' }, g) };
  const right = T.moon.x > 600;
  const spots = right ? [[360, 70, 190, 150, .95], [150, 245, 120, 150, .7], [660, 40, 110, 150, .6]] : [[860, 80, 190, 30, .95], [1080, 245, 130, 30, .7], [600, 45, 110, 30, .6]];
  spots.slice(0, T.meteors).forEach(a => met(...a));
  const M = T.moon;
  if (M.halo) add('circle', { cx: M.x, cy: M.y, r: M.r * 1.75, fill: 'none', stroke: M.color, 'stroke-opacity': .22, 'stroke-width': 3 });
  if (M.kind === 'full') {
    add('circle', { cx: M.x, cy: M.y, r: M.r * 2.6, fill: 'url(#mglow)' });
    add('circle', { cx: M.x, cy: M.y, r: M.r, fill: 'url(#moon)' });
    if (M.outline) add('circle', { cx: M.x, cy: M.y, r: M.r, fill: 'none', stroke: M.outline, 'stroke-opacity': .5, 'stroke-width': 2 });
    [[-.3, -.2, .18], [.25, .15, .22], [-.05, .38, .12], [.35, -.3, .1], [-.4, .25, .09]].forEach(([dx, dy, rr]) => add('circle', { cx: M.x + dx * M.r, cy: M.y + dy * M.r, r: rr * M.r, fill: M.crater, opacity: .45 }));
  } else {
    const off = (M.kind === 'gibbous' ? .2 : .45) * (right ? 1 : -1);
    add('circle', { cx: M.x + M.r * off, cy: M.y + M.r * .15, r: M.r * 2, fill: 'url(#mglow)' });
    add('circle', { cx: M.x, cy: M.y, r: M.r, fill: M.color, mask: 'url(#cut)' });
  }
}
</script></body></html>
