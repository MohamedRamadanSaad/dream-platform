mail.dream-submitted.subject=رؤيا جديدة من {userName}
mail.dream-submitted.preheader=أُضيفت رؤيا جديدة إلى قائمة المراجعة.
mail.youtube-new-video.subject=مقطع جديد: {videoTitle}
mail.youtube-new-video.preheader=نُشر مقطع جديد على القناة.

# ---------------------------------------------------------------- shared layout strings
mail.button.fallback=إذا لم يعمل الزر، انسخ هذا الرابط في المتصفح:
